<!DOCTYPE HTML>
<html>
	<head>
		<title>Gallry</title>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA==" crossorigin="anonymous" referrerpolicy="no-referrer">
		<style>
			body{
			 margin:0px;
			 background-color:white;
			}
			header{
			 height:60px;
			 background-color:lightgrey;
			 display:flex;
			 border-bottom:2px solid black;
			}
			.d1{
			 height:33px;
			 width:40px;
			 border:0px solid black;
			 margin:13px 0px 0px 30px;
			 border-radius:100px;
			 background-color:white;
			 color:green;
			 font-size:24px;
			 font-family:arial, sans-sarif;
			 text-align:center;
			 padding-top:6px;
			}
			.sp{
			  font-size:18px;
			  font-family:arial, sans-sarif;
			  margin:25px 0px 0px 4%;
			  text-decoration:none;
			  color:black;
			 }
			 aside{
			  height:569px;
			  width:100px;
			  border:1px solid black;
			 }
			 .d2{
			  height:60px;
			  width:90%;
			  border:0px solid black;
			  margin:20px 0px 0px 50px;
			  display:flex;
			  
			 }
			 .d3{
			  height:25px;
			  width:110px;
			  border:1px solid #f4f6f9;
			  border-radius:15px;
			  text-align:center;
			  font-size:18px;
			  font-family:arial, sans-sarif;
			  background-color:#f4f6f9;
			  margin:15px 0px 0px 30px;
			  padding-top:5px;
			 }
			 .d3:hover{
			  background-color:lightgrey;
			  border:1px solid blue;
			 }
			 
			 
			 .section{
			  height:600px;
			  width:90%;
			  background-color:#F5F5F0;
			  margin:30px 0px 0px 70px;
			  border-radius:15px;
			  display:flex;
			 }
			 
			.d4{
			 height:300px;
			 width:300px;
			 border:2px solid #A4EBF3;
			 border-radius:10px;
			 margin:60px 0px 0px 80px;
			 background-color:#FEFAF3;
			 <!-- position:relative; -->
			 <!-- top:40px; -->
			}
			.d5{
			 height:200px;
			 width:80%;
			 border:0px solid ;
			 border-radius:10px;
			 margin:15px 0px 0px 27px;
			}
			.img{
			 height:100%;
			 width:100%;
			 border-radius:10px;
			 filter:blur(5px);
			}
			.img:hover{
			 filter:brightness(100%);
			}
		</style>
	</head>
	<body>
		<header>
			<div class="d1">G</div>
			<span class="sp">Home</span>
			<span class="sp">Explore <i class="ri-arrow-down-s-line"></i></span>
			<span class="sp">Favorites <i class="ri-arrow-down-s-line"></i></span>
			<span class="sp">Fashion <i class="ri-arrow-down-s-line"></i></span>
			
			<span class="sp" style="margin-left:45%">Sign up <i class="ri-arrow-down-s-line"></i></span>
		</header>
		
		<main>
			<section>
				<div class="d2">
					<div class="d3">Birds</div>
					<div class="d3">Animals</div>
					<div class="d3">Movies</div>
					<div class="d3">Poster</div>
					<div class="d3">Designer</div>
					<div class="d3">Animation</div>
					<div class="d3">Template</div>
					<div class="d3" style="margin-left:27%;width:110px;	">Popular </div>
				</div>
			</section>
			
			
			<section class="section">
				<div class="d4">
					<div class="d5">
						<img src="https://media.istockphoto.com/id/183412466/photo/eastern-bluebirds-male-and-female.jpg?s=612x612&w=0&k=20&c=6_EQHnGedwdjM9QTUF2c1ce7cC3XtlxvMPpU5HAouhc=" class="img">
					</div>
				</div>
			</section>
		</main>
	</body>
</html>
