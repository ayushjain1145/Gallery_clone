			body{
				background-color:lightgrey;
				margin:0px;
			}
			header{
				display:flex;
				height:70px;
				background-color:white;
				position:sticky;
				top:0;
				z-index:2;
			}
			.d1{
			 height:33px;
			 width:40px;
			 border:0px solid black;
			 margin:13px 0px 0px 30px;
			 border-radius:100px;
			 background-color:lightgrey;
			 color:green;
			 font-size:24px;
			 font-family:arial, sans-sarif;
			 text-align:center;
			 padding-top:6px;
			}
			.d2{
			 height:30px;
			 width:50%;
			 border-radius:20px;
			 border:1px solid blue;
			 outline:none;
			 margin:18px 0px 0px 12%;
			 font-size:22px;
			 padding-left:15px;
			 }
			input{
			 border-radius:20px;
			 outline:none;
			 border:none;
			 margin-left:15px;
			 padding-top:7px;
			 width:90%;
			 font-size:16px;
			 }
			 .sp{
			  font-size:18px;
			  font-family:arial, sans-sarif;
			  margin:25px 0px 0px 3%;
			  text-decoration:none;
			  color:black;
			 }
			 .sp:hover{
			  color:purple;
			  
			 }
			 section{
			 height:2700px;
			 border:1px solid black;
			 display:flex;
			 flex-wrap:wrap;
			 background-color:black;
			 
			 }
			 .d3{
			 height:290px;
			 width:260px;
			 border:0px solid black;
			 margin:40px 0px 0px 60px;
			 border-radius:10px;
			 background-color:#F8FAFC;
			  filter:drop-shadow(3px 5px 30px white);
			 
			 }
			 .d3:hover{
			  filter:blur(3px);
			 }
			 
			
			 .img{
			  height:100%;
			  width:100%;
			  border-radius:10px;
			 }
			 .d4{
			 height:290px;
			 width:260px;
			 border:0px solid black;
			 margin:-17% 0px 0px 60px;
			 border-radius:10px;
			 background-color:#F8FAFC;
			 }
			 .d4:hover{
			  filter:brightness(150%);
			 }
			 .cont{
			  border:0px solid black;
			 }
			 .cont:hover{
			  filter:contrast(50%);
			 }
			 .gray:hover{
			  filter:grayscale(100%);
			 }
			 .hue105{
			  border:0px solid black;
			 }
			 .hue105:hover{
			  filter:hue-rotate(105deg);
			 }
			 .hue190{
			  border:0px solid black;
			 }
			 .hue190:hover{
			  filter:hue-rotate(190deg);
			 }
			 .hue180{
			  border:0px solid black;
			 }
			 .hue180:hover{
			  filter:hue-rotate(270deg);
			 }
			 .inv{
			 border:0px solid black;
			 }
			 .inv:hover{
			  filter:invert(90%);
			 }
			 .opa{
			 border:0px solid black;
			 }
			 .opa:hover{
			 filter:opacity(30%);	
			 }
		</style>
